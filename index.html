<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Tietoturvakäytäntö: koodia vain omalta sivulta ja PeerJS:n CDN:stä, yhteydet vain PeerJS-palvelimeen. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'sha256-+7+eMUcROx4cUR1wJi5BWmZuWq2i1QzlNk1XPw9F1Ag='; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://0.peerjs.com wss://0.peerjs.com; worker-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="description" content="Selaimessa pelattava zombiareena kavereille">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%235d6b48'/%3E%3Ccircle cx='11' cy='13' r='3' fill='%23ff3b30'/%3E%3Ccircle cx='21' cy='13' r='3' fill='%23ff3b30'/%3E%3Cpath d='M9 22h14' stroke='%232b331f' stroke-width='3'/%3E%3C/svg%3E">
  <title>Zombiareena</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="lobby" class="overlay">
    <div class="panel">
      <h1>Zombiareena</h1>

      <div class="row">
        <label class="field">
          <span>Nimesi</span>
          <input id="name" maxlength="16" autocomplete="off" placeholder="Pelaaja">
        </label>
        <button id="charopen" class="secondary">Hahmo</button>
      </div>

      <section>
        <h2>Luo huone</h2>
        <div class="row">
          <label class="field small">
            <span>Pisteraja</span>
            <select id="target">
              <option value="10">10</option>
              <option value="20" selected>20</option>
              <option value="30">30</option>
            </select>
          </label>
          <label class="field small">
            <span>Botteja</span>
            <select id="bots">
              <option value="0">0</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3" selected>3</option>
            </select>
          </label>
          <button id="host">Luo huone</button>
        </div>
        <p class="hint">Saat huonekoodin ja linkin, jonka voit jakaa kavereille. Botit väistyvät, kun huone täyttyy.</p>
      </section>

      <section>
        <h2>Liity huoneeseen</h2>
        <div class="row">
          <label class="field small">
            <span>Koodi</span>
            <input id="code" maxlength="4" autocomplete="off" placeholder="ABCD">
          </label>
          <button id="join">Liity</button>
        </div>
      </section>

      <p id="status" class="status"></p>
    </div>
  </div>

  <div id="charpanel" class="overlay dim" hidden>
    <div class="panel">
      <h2>Hahmo</h2>
      <canvas id="charpreview" width="180" height="180"></canvas>
      <div id="swatches" class="swatches"></div>
      <p id="colornote" class="hint"></p>
      <div class="optrow" data-opt="hat">
        <span class="optlabel">Päähine</span>
        <button class="step" data-dir="-1" aria-label="Edellinen">◀</button>
        <span class="optvalue"></span>
        <button class="step" data-dir="1" aria-label="Seuraava">▶</button>
      </div>
      <div class="optrow" data-opt="pattern">
        <span class="optlabel">Kuvio</span>
        <button class="step" data-dir="-1" aria-label="Edellinen">◀</button>
        <span class="optvalue"></span>
        <button class="step" data-dir="1" aria-label="Seuraava">▶</button>
      </div>
      <div class="optrow" data-opt="face">
        <span class="optlabel">Kasvot</span>
        <button class="step" data-dir="-1" aria-label="Edellinen">◀</button>
        <span class="optvalue"></span>
        <button class="step" data-dir="1" aria-label="Seuraava">▶</button>
      </div>
      <button id="chardone" class="done">Valmis</button>
    </div>
  </div>

  <input id="chatinput" hidden autocomplete="off" placeholder="Kirjoita viesti – Enter lähettää, Esc peruu">

  <div id="roominfo" hidden>
    <span id="roomtext"></span>
    <button id="start" class="primary" hidden>Aloita peli</button>
    <button id="charbtn" hidden>Hahmo</button>
    <button id="mute">Äänet: päällä</button>
    <button id="copylink">Kopioi linkki</button>
    <button id="leave">Poistu</button>
  </div>

  <!-- integrity: selain kieltäytyy ajamasta tiedostoa, jos se on CDN:ssä muuttunut. -->
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"
    integrity="sha384-x0YgkOr/3UOZP2CRDxGW9e0Q+2Qjyr3uJrm4xU32Y7ZCNAo7Cc7bjhrZMi/dwczu"
    crossorigin="anonymous"></script>

  <script type="importmap">
{

    "./src/boss.js": "./src/boss.js?v=379f0dfc9d",
    "./src/bot.js": "./src/bot.js?v=73a507bee8",
    "./src/chat.js": "./src/chat.js?v=5f31a56743",
    "./src/client.js": "./src/client.js?v=6889f4e045",
    "./src/constants.js": "./src/constants.js?v=3a0217852e",
    "./src/game.js": "./src/game.js?v=2e0ad54938",
    "./src/geometry.js": "./src/geometry.js?v=9ff1458b35",
    "./src/host.js": "./src/host.js?v=84f66729bf",
    "./src/input.js": "./src/input.js?v=2799706a1c",
    "./src/main.js": "./src/main.js?v=a4a3c59983",
    "./src/map.js": "./src/map.js?v=945579e491",
    "./src/maps.js": "./src/maps.js?v=0a3712e56d",
    "./src/protocol.js": "./src/protocol.js?v=790b9807c6",
    "./src/render.js": "./src/render.js?v=8f2f3de7bb",
    "./src/sound.js": "./src/sound.js?v=f32f484f3c",
    "./src/vision.js": "./src/vision.js?v=fb5e61c51c",
    "./src/weapons.js": "./src/weapons.js?v=8f06749503",

  }
}
  </script>
  <script type="module" src="src/main.js?v=a4a3c59983"></script>
</body>
</html>
